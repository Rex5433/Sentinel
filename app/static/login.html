<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Sentinel · Roar Cyber | Team 84</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/login.js" defer></script>
</head>
<body>
  <main class="login-shell">
    <div class="brand"><span class="brand-mark" aria-hidden="true">S</span><span>Sentinel <small>Roar Cyber | Team 84</small></span></div>
    <section class="panel" aria-labelledby="login-title">
      <h1 id="login-title">Sign in</h1>
      <p class="muted">Use your local Sentinel account.</p>
      <p id="setup-message" hidden>Before first sign-in, run Start Sentinel and create your local owner account in its console. There is no default password.</p>
      <form id="login-form">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" maxlength="32" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
        <button id="login-button" type="submit">Sign in</button>
      </form>
      <p id="login-status" role="status" aria-live="polite"></p>
      <noscript>JavaScript is required for local sign-in.</noscript>
    </section>
    <p class="small muted">Access stays on this computer.</p>
    <a href="/health">Service health</a>
  </main>
</body>
</html>
